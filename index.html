<title>おしごと</title>
<style>
:root{
  --bg:#FAF6EF; --ink:#3A3226; --ink2:#857761; --paper:#FFFCF5; --line:#E6DccB;
  --red:#C8564B; --mint:#E4F2EA; --butter:#F7EEDA; --peach:#F8E6DA; --sky:#E1EFF4; --lav:#ECE7F3;
  --sw:390px; --u:3.9px;
}
*{
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  box-sizing:border-box;
}
html,body{
  position:fixed; inset:0; overflow:hidden; margin:0;
  overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
html{padding:0;background:var(--bg)}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN",sans-serif;
  transition:filter .6s ease;
}
html.night body{filter:brightness(.78) sepia(.12)}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;color:inherit}
#app{position:relative;width:100%;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;overflow:hidden;visibility:hidden;background:var(--bg)}
.screen.on{visibility:visible}
.root{position:absolute;inset:0}
.stage{position:absolute;top:0;bottom:0;left:50%;width:var(--sw);margin-left:calc(var(--sw) / -2);display:flex;flex-direction:column}
.cursor{display:inline;color:var(--ink2);animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.banner{
  margin:calc(var(--u)*3) 64px 0 calc(var(--u)*4);
  min-height:calc(var(--u)*13); padding:calc(var(--u)*2) calc(var(--u)*4);
  background:var(--paper); border-radius:calc(var(--u)*7);
  display:flex; align-items:center;
  font-size:calc(var(--u)*5); line-height:1.3; letter-spacing:.02em;
  box-shadow:0 calc(var(--u)*.8) 0 rgba(58,50,38,.08);
  flex:none;
}

/* ---------- 共通の演出 ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.ripple{position:absolute;margin:calc(var(--u)*-11) 0 0 calc(var(--u)*-11);width:calc(var(--u)*22);height:calc(var(--u)*22);border-radius:50%;border:calc(var(--u)*1.2) solid rgba(240,190,120,.8);opacity:0;left:-999px;top:-999px}
.spark{position:absolute;margin:calc(var(--u)*-3.5) 0 0 calc(var(--u)*-3.5);width:calc(var(--u)*7);height:calc(var(--u)*7);opacity:0;left:-999px;top:-999px}
.spark svg{width:100%;height:100%;display:block}

/* ---------- 起動画面 ---------- */
.boot{align-items:center;justify-content:center;gap:calc(var(--u)*8)}
.boot-title{font-size:calc(var(--u)*15);letter-spacing:.1em;color:var(--ink)}
.boot-icons{display:grid;grid-template-columns:repeat(4,auto);gap:calc(var(--u)*3)}
.boot-icons div{width:calc(var(--u)*18);height:calc(var(--u)*18);border-radius:calc(var(--u)*5);display:flex;align-items:center;justify-content:center}
.boot-icons svg{width:80%;height:80%}
.boot-btn{width:calc(var(--u)*46);height:calc(var(--u)*46);border-radius:50%;background:#F4C99B;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*7);color:var(--ink);box-shadow:0 calc(var(--u)*1.5) 0 #DDA874;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- おしごと えらび ---------- */
.cards{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:calc(var(--u)*4);padding:calc(var(--u)*5) calc(var(--u)*5) calc(var(--u)*7);align-content:stretch}
.card{min-height:0;overflow:hidden;border-radius:calc(var(--u)*7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);box-shadow:0 calc(var(--u)*1.4) 0 rgba(58,50,38,.12);font-size:calc(var(--u)*5);max-height:calc(var(--u)*80)}
.card svg{width:70%;max-height:65%}
.cards.many{gap:calc(var(--u)*3);padding:calc(var(--u)*4) calc(var(--u)*5) calc(var(--u)*6)}
.cards.many .card{border-radius:calc(var(--u)*5);font-size:calc(var(--u)*4.4);gap:calc(var(--u)*1)}
.cards.many .card svg{width:60%;max-height:58%}
.card.one{grid-column:1 / span 2}
.c-pharmacy{background:#CDE8D8}.c-stamp{background:#F3E1B7}.c-register{background:#F4CFBC}.c-delivery{background:#CBE2EC}

/* ---------- はんこ ---------- */
.s-stamp{background:var(--butter)}
.desk{position:relative;flex:1}
.paper{position:absolute;left:9%;right:9%;top:6%;bottom:8%}
.paper-in{position:absolute;inset:0;background:var(--paper);border-radius:calc(var(--u)*2.5);box-shadow:0 calc(var(--u)*1.2) calc(var(--u)*2) rgba(58,50,38,.12);padding:calc(var(--u)*6) calc(var(--u)*6)}
.paper-title{font-size:calc(var(--u)*5.4);min-height:1.4em;border-bottom:calc(var(--u)*.6) solid var(--line);padding-bottom:calc(var(--u)*2);margin-bottom:calc(var(--u)*4)}
.paper-row{font-size:calc(var(--u)*4);color:#B9AD9A;margin:calc(var(--u)*3.2) 0;display:flex;gap:calc(var(--u)*2);align-items:center}
.paper-row b{font-weight:normal;flex:1;border-bottom:calc(var(--u)*.4) dashed var(--line);height:1em}
.frame{position:absolute;width:calc(var(--u)*22);height:calc(var(--u)*22);margin:calc(var(--u)*-11) 0 0 calc(var(--u)*-11);border-radius:50%;border:calc(var(--u)*.8) dashed #E4A79E;display:flex;align-items:center;justify-content:center;text-align:center;font-size:calc(var(--u)*3.2);color:#D9A097;line-height:1.3}
.hana{position:absolute;width:calc(var(--u)*26);height:calc(var(--u)*26);margin:calc(var(--u)*-13) 0 0 calc(var(--u)*-13);pointer-events:none}
.stampmark{position:absolute;width:calc(var(--u)*19);height:calc(var(--u)*19);left:0;top:0;pointer-events:none}
.stampmark .ink{position:absolute;inset:-8%;border-radius:50%;background:rgba(200,86,75,.35);filter:blur(calc(var(--u)*1.2));opacity:0}
.stampmark .face{position:absolute;inset:0;border-radius:50%;border:calc(var(--u)*1.1) solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font-size:calc(var(--u)*3.8);line-height:1.15;font-weight:bold;background:rgba(255,252,245,.15)}

/* ---------- レジ ---------- */
.s-register{background:var(--peach)}
.reg{position:relative;margin:calc(var(--u)*4) calc(var(--u)*5) 0;background:#E9B9A0;border-radius:calc(var(--u)*5);padding:calc(var(--u)*4);box-shadow:0 calc(var(--u)*1.4) 0 #CF9E86;flex:none}
.reg-screen{background:#4F5E57;border-radius:calc(var(--u)*3);padding:calc(var(--u)*3) calc(var(--u)*4);color:#E3F0D5;display:flex;align-items:baseline;justify-content:space-between}
.reg-label{font-size:calc(var(--u)*4.4)}
.reg-num{font-size:calc(var(--u)*11);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.reg-num small{font-size:calc(var(--u)*4.4);margin-left:calc(var(--u)*1)}
.tray{height:calc(var(--u)*15);margin-top:calc(var(--u)*3);background:#F6DACB;border-radius:calc(var(--u)*3);display:flex;align-items:center;gap:calc(var(--u)*1);padding:0 calc(var(--u)*2);overflow:hidden}
.tray span{font-size:calc(var(--u)*8);line-height:1;display:inline-block}
.slot{position:absolute;left:22%;right:22%;bottom:calc(var(--u)*-1.6);height:calc(var(--u)*3);background:#5D4F44;border-radius:calc(var(--u)*1.5);z-index:3}
.payrow{flex:none;display:flex;justify-content:center;padding:calc(var(--u)*7) 0 calc(var(--u)*4)}
.pay{position:relative;width:calc(var(--u)*62);height:calc(var(--u)*20);border-radius:calc(var(--u)*10);background:#F0A98E;box-shadow:0 calc(var(--u)*1.6) 0 #CF8A70;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*7);letter-spacing:.08em}
.pay::after,.go::after{content:"";position:absolute;inset:calc(var(--u)*-2.5);border-radius:inherit;box-shadow:0 0 calc(var(--u)*5) calc(var(--u)*2) rgba(255,214,140,.95);opacity:0;pointer-events:none}
.ready{animation:wobble .9s ease-in-out infinite}
.ready::after{animation:glow 1.8s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.03)}75%{transform:rotate(3deg) scale(1.03)}}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:1}}
.belt{position:relative;flex:1;margin:calc(var(--u)*2) 0 calc(var(--u)*6);min-height:calc(var(--u)*30)}
.belt-base{position:absolute;left:0;right:0;bottom:calc(var(--u)*3);height:calc(var(--u)*9);background:#8F877D;border-radius:calc(var(--u)*4.5);overflow:hidden}
.belt-stripes{position:absolute;top:0;bottom:0;left:0;width:200%;background:repeating-linear-gradient(90deg,#8F877D 0 calc(var(--u)*5),#7E776E calc(var(--u)*5) calc(var(--u)*10))}
.prod{position:absolute;left:0;bottom:calc(var(--u)*10);width:calc(var(--u)*22);height:calc(var(--u)*22);border-radius:calc(var(--u)*5);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*13);box-shadow:0 calc(var(--u)*1) 0 rgba(58,50,38,.15);overflow:hidden;transition:opacity .35s ease}
.prod.gone{opacity:0}
.scanline{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*2.2);background:rgba(232,110,100,.75);box-shadow:0 0 calc(var(--u)*2) rgba(232,110,100,.8);opacity:0}
.flyer{position:absolute;width:calc(var(--u)*16);height:calc(var(--u)*16);margin:calc(var(--u)*-8) 0 0 calc(var(--u)*-8);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*13);line-height:1;z-index:25;pointer-events:none}
.receipt-clip{position:absolute;overflow:hidden;z-index:20;left:50%;width:calc(var(--u)*58);margin-left:calc(var(--u)*-29)}
.receipt{background:var(--paper);padding:calc(var(--u)*7) calc(var(--u)*4) calc(var(--u)*6);font-size:calc(var(--u)*4.4);box-shadow:0 calc(var(--u)*1) calc(var(--u)*2) rgba(58,50,38,.15);border-top:calc(var(--u)*.6) dashed #C9BCA8}
.rline{display:flex;justify-content:space-between;min-height:1.6em;align-items:center;white-space:nowrap}
.rline.center{justify-content:center}
.rline.total{font-size:calc(var(--u)*5.4);border-top:calc(var(--u)*.4) solid var(--line);margin-top:calc(var(--u)*1)}
.cut-hint{position:absolute;left:0;right:0;top:calc(var(--u)*-0.2);text-align:center;font-size:calc(var(--u)*3.6);color:#B9AD9A;opacity:0}

/* ---------- おくすりやさん ---------- */
.s-pharmacy{background:var(--mint)}
.rx{margin:calc(var(--u)*3) 64px 0 calc(var(--u)*4);background:var(--paper);border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.5) calc(var(--u)*4);box-shadow:0 calc(var(--u)*.8) 0 rgba(58,50,38,.08);flex:none;border-left:calc(var(--u)*2) solid #9FD3B5}
.rx-title{font-size:calc(var(--u)*3.6);color:var(--ink2)}
.rx-text{font-size:calc(var(--u)*5.4);min-height:1.4em}
.counter{position:relative;flex:1.2}
.bag{position:absolute;left:10%;top:6%;width:calc(var(--u)*40);height:calc(var(--u)*48)}
.bag-in{position:absolute;inset:0}
.bag svg{width:100%;height:100%;display:block;overflow:visible}
.bag-flap{opacity:0;transition:opacity .3s ease}
.bag.closed .bag-flap{opacity:1}
.bag.closed .bag-open{opacity:0}
.bag-label{position:absolute;left:12%;right:12%;top:70%;height:20%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:calc(var(--u)*3.1);line-height:1.15;color:var(--ink)}
.cust{position:absolute;right:4%;top:2%;width:calc(var(--u)*40);height:calc(var(--u)*56);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transform:translateX(160%)}
.cust-face{width:calc(var(--u)*32);height:calc(var(--u)*32);border-radius:50%;background:#FDF0DC;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*21);line-height:1;box-shadow:0 calc(var(--u)*1.2) 0 rgba(58,50,38,.1)}
.bubble{position:relative;margin-bottom:calc(var(--u)*3);background:var(--paper);border-radius:calc(var(--u)*4);padding:calc(var(--u)*2) calc(var(--u)*3);font-size:calc(var(--u)*4.4);white-space:nowrap;opacity:0;box-shadow:0 calc(var(--u)*.8) 0 rgba(58,50,38,.08)}
.bubble::after{content:"";position:absolute;left:50%;bottom:calc(var(--u)*-2.4);margin-left:calc(var(--u)*-2);border:calc(var(--u)*2) solid transparent;border-top-color:var(--paper);border-bottom:0}
.medtray{position:relative;flex:1;margin:0 calc(var(--u)*4) calc(var(--u)*6);background:#D2E9DC;border-radius:calc(var(--u)*6);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:calc(var(--u)*3);padding:calc(var(--u)*3)}
.med{width:calc(var(--u)*22);height:calc(var(--u)*22);display:flex;align-items:center;justify-content:center;touch-action:none;position:relative}
.med svg{width:100%;height:100%;display:block;pointer-events:none}

/* ---------- たっきゅうびん ---------- */
.s-delivery{background:var(--sky)}
.scene{position:relative;flex:1.4;margin-top:calc(var(--u)*3);overflow:hidden;background:#D6EBF2}
.hills{position:absolute;left:0;bottom:calc(var(--u)*12);width:200%;height:calc(var(--u)*26);display:flex}
.hills .tile{position:relative;width:50%;height:100%}
.hills svg{position:absolute;bottom:0}
.sun{position:absolute;left:8%;top:10%;width:calc(var(--u)*16);height:calc(var(--u)*16);border-radius:50%;background:#F6DFA2}
.cloud{position:absolute;height:calc(var(--u)*7);border-radius:calc(var(--u)*4);background:#F4F9FA}
.road{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*13);background:#CFC6B8}
.road::after{content:"";position:absolute;left:0;right:0;top:45%;height:calc(var(--u)*1);background:repeating-linear-gradient(90deg,#F4EEE2 0 calc(var(--u)*7),transparent calc(var(--u)*7) calc(var(--u)*13))}
.truck{position:absolute;bottom:calc(var(--u)*4);left:50%;width:calc(var(--u)*74);height:calc(var(--u)*40.7);margin-left:calc(var(--u)*-37)}

    if (c.state !== "running") { this.next = c.currentTime + 0.1; return; }
    if (this.next < c.currentTime) this.next = c.currentTime + 0.05;
    const sg = SONGS[this.cur]._c;
    while (this.next < c.currentTime + 0.4) {
      sg.ev[this.step].forEach(e => this.note(e, this.next, sg.eighth));
      this.next += sg.eighth;
      this.step = (this.step + 1) % sg.steps;
    }
  },
  note(e, t, eighth){
    const c = Sound.ctx, g = c.createGain();
    g.connect(this.out);
    if (e.k === "tick") {   // 小太鼓のような小さな「チャッ」
      const src = c.createBufferSource(), f = c.createBiquadFilter();
      src.buffer = Sound.noiseBuf; f.type = "highpass"; f.frequency.value = 5000;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.035, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      src.connect(f); f.connect(g); src.start(t); src.stop(t + 0.06);
      return;
    }
    const o = c.createOscillator(), len = eighth * e.len;
    const peak = e.k === "mel" ? 0.12 : 0.16;
    o.type = e.k === "mel" ? "square" : "triangle";
    o.frequency.setValueAtTime(e.f, t);
    let tone = o;
    if (e.k === "mel") {    // 四角い波を少しまるくして、耳にやさしく
      const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 2200;
      o.connect(f); tone = f;
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    g.gain.exponentialRampToValueAtTime(peak * 0.5, t + Math.min(len * 0.5, 0.15));
    g.gain.exponentialRampToValueAtTime(0.0001, t + len * 0.9);
    tone.connect(g); o.start(t); o.stop(t + len);
  },
};

/* ---------- タイピング表示 ---------- */
const typers = new Set();
function typeText(el, text, scope, done){
  if (el._typer) el._typer.stop();
  const chars = Array.from(text);
  el.textContent = "";
  const txt = document.createElement("span"), cur = document.createElement("span");
  cur.className = "cursor"; cur.textContent = "▍";
  el.append(txt, cur);
  let i = 0, over = false, id = 0;
  const T = {
    scope,
    stop(){ if (over) return; over = true; scope.stopInterval(id); typers.delete(T); el._typer = null; },
    finish(){
      if (over) return;
      txt.textContent = text; T.stop();
      if (!el.classList.contains("t")) cur.remove();   // カーソルを残すのは上の文字帯だけ
      if (done && scope.alive) done();
    },
  };
  id = scope.interval(() => {
    i++;
    txt.textContent = chars.slice(0, i).join("");
    if (chars[i - 1] && chars[i - 1].trim()) Sound.play("kata");
    if (i >= chars.length) T.finish();
  }, S.typeSpeed);
  typers.add(T); el._typer = T;
  if (!chars.length) T.finish();
  return T;
}
function finishAllTyping(){ Array.from(typers).forEach(T => { if (T.scope.alive) T.finish(); else typers.delete(T); }); }

};

/* ---------- ドラッグ（タップだけでも必ず届く） ---------- */
function makeDraggable(el, scope, o){
  let st = null;
  el.addEventListener("pointerdown", e => {
    if (!e.isPrimary || el.dataset.st !== "idle" || !scope.alive) return;
    e._handled = true;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const r = el.getBoundingClientRect(), tr = o.target().getBoundingClientRect();
    st = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, c0: center(r), d0: dist(center(r), center(tr)) };
    el.dataset.st = "drag"; el.style.zIndex = 30;
    el.style.transform = "translate(0px,0px) scale(1.12)";
    Sound.play("pick");
  });
  el.addEventListener("pointermove", e => {
    if (!st || e.pointerId !== st.id) return;
    st.dx = e.clientX - st.x0; st.dy = e.clientY - st.y0;
    el.style.transform = `translate(${st.dx}px,${st.dy}px) scale(1.12)`;
  });
  const up = e => {
    if (!st || e.pointerId !== st.id) return;
    const s = st; st = null;
    if (!scope.alive) return;
    const moved = Math.hypot(s.dx, s.dy);
    const tr = o.target().getBoundingClientRect();
    const c = { x: s.c0.x + s.dx, y: s.c0.y + s.dy };
    // 見た目より 1.5 倍広い当たり判定
    const ex = tr.width * 0.25, ey = tr.height * 0.25;
    const inside = c.x > tr.left - ex && c.x < tr.right + ex && c.y > tr.top - ey && c.y < tr.bottom + ey;
    const closer = dist(c, center(tr)) < s.d0 - 4;
    const from = `translate(${s.dx}px,${s.dy}px) scale(1.12)`;
    if (moved < 14 || inside || closer || e.type === "pointercancel") {
      const dest = o.dest();
      const tx = dest.x - s.c0.x, ty = dest.y - s.c0.y;
      el.dataset.st = "fly";
      scope.anim(el, [
        { transform: from, opacity: 1 },
        { transform: `translate(${(s.dx + tx) / 2}px,${Math.min(s.dy, ty) - U * 10}px) scale(1)`, opacity: 1, offset: 0.55 },
        { transform: `translate(${tx}px,${ty}px) scale(${dest.s || 0.4})`, opacity: dest.keep ? 1 : 0.2 },
      ], { duration: 420, easing: "ease-in" }, () => {
        el.dataset.st = "done"; el.style.visibility = "hidden";
        o.onArrive(el);
      });
    } else {
      el.dataset.st = "back";
      Sound.play("boing");
      scope.anim(el, [{ transform: from }, { transform: "translate(0px,0px) scale(1)" }],
        { duration: 320, easing: "cubic-bezier(.3,1.5,.5,1)" }, () => { el.dataset.st = "idle"; el.style.zIndex = ""; });
    }
  };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
}
function popIn(el, scope, delay, after){
  el.dataset.st = "enter";
  scope.anim(el, [{ transform: "scale(0)", opacity: 0 }, { transform: "scale(1.12)", opacity: 1, offset: 0.7 }, { transform: "scale(1)", opacity: 1 }],
    { duration: 380, delay: delay || 0, easing: "ease-out", fill: "both" }, () => { el.dataset.st = "idle"; el.style.transform = ""; if (after) after(); });
}
function bounce(el, scope, k){
  k = k || 1.1;
  scope.anim(el, [{ transform: "scale(1)" }, { transform: `scale(${k})` }, { transform: "scale(1)" }], { duration: 260, easing: "ease-out" });
}

const screens = {};
let current = null, curScope = null, navBusy = false;

function go(name){
  if (navBusy || current === name || !screens[name]) return;
  navBusy = true;
  const prev = current ? screens[current] : null;
  if (curScope) curScope.clear();
  const scope = new Scope();
  curScope = scope;
  const next = screens[name];
  next.el.innerHTML = "";
  next.el.classList.add("on");
  const root = document.createElement("div");
  root.className = "root";
  next.el.appendChild(root);
  next.enter(scope, root);
  current = name;
  HomeBtn.show(GAMES.includes(name));
  BGM.play(name);   // 遊びの画面とえらぶ画面だけ流す（設定・おしまいでは止まる）
  const w = window.innerWidth * M;
  next.el.animate([{ transform: `translateX(${w}px)`, opacity: REDUCED ? 0 : 1 }, { transform: "translateX(0)", opacity: 1 }], { duration: 400, easing: "ease-in-out" });
  if (prev) {
    const pa = prev.el.animate([{ transform: "translateX(0)", opacity: 1 }, { transform: `translateX(${-w}px)`, opacity: REDUCED ? 0 : 1 }], { duration: 400, easing: "ease-in-out", fill: "forwards" });
    setTimeout(() => {
      pa.cancel();
      if (prev !== screens[current]) { prev.el.classList.remove("on"); prev.el.innerHTML = ""; }
      navBusy = false;
    }, 420);
  } else {
    setTimeout(() => { navBusy = false; }, 420);
  }
  if (GAMES.includes(name) && S.autoSwitch > 0) {
    scope.timeout(() => { const n = nextGame(name); if (n !== name) go(n); }, S.autoSwitch * 60000);
  }
}

    const t0 = performance.now();
    function loop(ts){

      if (list.length > 6) lines.push([`ほか ${list.length - 6}こ`, String(sum(list.slice(6))), ""]);

      lines.push(["ありがとう", "", "center"]);

      const sr = st.getBoundingClientRect(), rr = reg.getBoundingClientRect();

        if (k >= rows.length) {

          clip._printed = performance.now();

        row.style.visibility = "visible";

      if (cart.length >= 3) pay.classList.add("ready");

    }

  },
};

function nearest(list, x, y){
  let best = null, bd = Infinity;
  list.forEach(el => { const c = center(el.getBoundingClientRect()); const d = Math.hypot(c.x - x, c.y - y); if (d < bd) { bd = d; best = el; } });
  return best;
}

function flyEl(scope, host, html, from, to, o, done){
  o = o || {};
  const hr = host.getBoundingClientRect(), size = o.size || U * 14;
  const f = h(`<div class="flyer2">${html}</div>`);
  f.style.width = size + "px"; f.style.height = size + "px";
  if (o.font) f.style.fontSize = o.font + "px";
  f.style.left = (from.x - hr.left - size / 2) + "px"; f.style.top = (from.y - hr.top - size / 2) + "px";
  host.appendChild(f);
  const dx = to.x - from.x, dy = to.y - from.y, sc = o.scale == null ? 1 : o.scale, arc = o.arc == null ? U * 10 : o.arc;
  scope.anim(f, [
    { transform: "translate(0px,0px) scale(1)", opacity: 1 },
    { transform: `translate(${dx / 2}px,${dy / 2 - arc}px) scale(${(1 + sc) / 2})`, opacity: 1, offset: 0.5 },
    { transform: `translate(${dx}px,${dy}px) scale(${sc})`, opacity: o.fade ? 0 : 1 },
  ], { duration: o.dur || 450, easing: "ease-in-out" }, () => { f.remove(); if (done) done(); });
  return f;
}

const LAB_COLORS = ["#F2A0A8", "#9CC8DD", "#F5D88E", "#B5DDB5", "#C9B3E6"];
function mixColors(list){
  const c = list.map(x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16)));
  const avg = [0, 1, 2].map(k => Math.round(c.reduce((a, v) => a + v[k], 0) / c.length));
  return "#" + avg.map(v => v.toString(16).padStart(2, "0")).join("");
}

          box.appendChild(r); off.push(r);
          const from = cpt(w), em = w.textContent; w.textContent = "";
          scope.timeout(() => flyEl(scope, st, em, from, cpt(r), { size: U * 14, font: U * 12, dur: 450 }, () => { r.style.opacity = 1; const c = cpt(r); FX.burst(c.x, c.y, 3); }), 300 + i * 180);
        }
        onboard = 0;
        scope.timeout(() => {
          off.forEach(r => scope.anim(r, [{ transform: "translateX(0px)", opacity: 1 }, { transform: `translateX(${-U * 30}px)`, opacity: 0 }], { duration: 600, easing: "ease-in" }, () => r.remove()));
          scope.anim(kSay, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 });
          scope.timeout(startBoard, off.length ? 650 : 0);
        }, 2600);
      });
    }
    function act(src){
      if (phase === "board") return takeoff();
      if (phase === "turn") return turn();
      if (phase === "land") return land();
      Sound.play("pop");
    }
    lever.addEventListener("pointerdown", e => { if (!e.isPrimary) return; e._handled = true; bounce(lever, scope, 1.06); act("lever"); });
    yoke.addEventListener("pointerdown", e => { if (!e.isPrimary) return; e._handled = true; bounce(yoke, scope, 1.04); act("yoke"); });
    el.addEventListener("pointerdown", e => {
      if (!e.isPrimary || e._handled) return;
      e._handled = true; if (phase === "busy") FX.burst(e.clientX, e.clientY, 3); act(null);
    });
    kingdom.style.opacity = 0;
    plat = makePlat("そら くうこう");
    startBoard();
  },
};

/* ---------- おしまい ---------- */
screens.end = {
  el: $("#s-end"),
  enter(scope, el){
    el.appendChild(h(`<div class="stage endbox">${ART.moon()}<div>おしまい</div><div style="font-size:calc(var(--u)*5.5)">また あそぼうね</div></div>`));

/* ---------- 保護者せってい ---------- */
screens.parent = {
  el: $("#s-parent"),

      <h1>ほごしゃ せってい</h1>
      <div class="pcard"><h2>こどもの なまえ</h2>
        <input class="txt" id="pName" maxlength="12" autocomplete="off">
        <h2 style="margin:14px 0 8px">よびかた・いろ</h2>

      <div class="pcard"><h2>かぞくの ことば</h2>
        <div class="chips" id="pChips"></div>
        <div class="addrow"><input class="txt" id="pFam" maxlength="10" placeholder="れい：ねえね" autocomplete="off"><button class="pbtn" id="pFamAdd">ついか</button></div></div>
      <div class="pcard">
        <div class="prow"><h2 style="margin:0">おと</h2>${tg("sound", S.sound)}</div>
        <div class="prow"><span>おんがく（BGM）</span>${tg("bgm", S.bgm)}</div>
        <div class="prow"><span>おとの おおきさ</span>${seg("volume", [[0, "小"], [1, "中"], [2, "大"]], S.volume)}</div>

        <div class="prow"><span>よるモード（くらめ）</span>${tg("night", S.night)}</div>
      </div>
      <div class="pcard"><h2>あそぶ おしごと</h2>
        ${GAMES.map(g => `<div class="prow"><span>${GAME_INFO[g].label}</span>${tg("game:" + g, S.games[g])}</div>`).join("")}
        <p>全部をオフにはできません（1つは残ります）。</p></div>
      <div class="pcard"><h2>じどう きりかえ</h2>
        <div class="prow"><span>おなじ あそびを</span>${seg("autoSwitch", [[0, "OFF"], [3, "3分"], [5, "5分"], [10, "10分"]], S.autoSwitch)}</div>
        <p>決めた時間がたつと、つぎの あそびに自動で切りかわります。</p></div>
      <div class="pcard"><h2>あんしょうばんごう（PIN）</h2>
        <div class="prow"><span>あんしょうばんごうを つかう</span>${tg("usePin", S.usePin)}</div>
        <p>オフ：右上の ⚙️ を3秒おしつづけると、すぐ この画面が開きます。<br>オン：⚙️ を3秒おしたあと、4けたの番号（はじめは 0000）を入れると開きます。子どもが この画面を開けるようになったら オンにしてください。</p>
        <div class="addrow" style="margin-bottom:8px"><input class="txt pin-in" id="pPin1" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="あたらしい 4けた" autocomplete="off"></div>
        <div class="addrow"><input class="txt pin-in" id="pPin2" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="もういちど" autocomplete="off"><button class="pbtn" id="pPinSet">かえる</button></div>
        <div class="pmsg" id="pPinMsg"></div>
        <p>わからなくなったときは、Safari の「履歴と Web サイトデータを消去」をすると 0000 にもどります（名前などの設定も消えます）。</p></div>
      <div class="pcard"><h2>アクセスガイドの つかいかた（たいせつ）</h2>
        <p>iPhone の「設定 → アクセシビリティ → アクセスガイド」をオンにし、アプリを開いたあとにサイドボタン（またはホームボタン）を3回押すと、アプリが固定されます。子どもはほかのアプリに移れなくなります。</p>
        <p>解除するときも、同じように3回押してパスコードを入れます。</p>
        <p>アプリの中の対策だけでは、Safari の画面から抜けられることがあります。アクセスガイドがいちばん確実な守りです。</p></div>
      <div class="pcard"><h2>ホーム画面に追加する</h2>
        <ol><li>Safari でこのページを開く</li><li>下の「共有」ボタン（四角から矢印）を押す</li><li>「ホーム画面に追加」を選び、名前を「おしごと」にして追加</li><li>ホーム画面の「おしごと」アイコンから開く</li></ol></div>
      <div class="pcard"><h2>音が出ないとき</h2>
        <p>iPhone の横にあるスイッチ（消音モード）がオンだと音が出ません。消音モードを切るか、音量ボタンで音を上げてください。</p></div>
      <div class="pbig">
        <button class="pbtn main" id="pBack">あそびに もどる</button>

    el.appendChild(w);
    const name = $("#pName", w), chips = $("#pChips", w), fam = $("#pFam", w);
    name.value = S.childName === "◯◯" ? "" : S.childName;
    name.addEventListener("input", () => { S.childName = name.value.trim() || "◯◯"; saveSettings(); });
    function drawChips(){
      chips.innerHTML = "";
      S.familyWords.forEach((wd, i) => {
        const c = h(`<span class="chip"><span></span><button aria-label="けす">×</button></span>`);
        c.firstElementChild.textContent = wd;
        $("button", c).addEventListener("click", () => { S.familyWords.splice(i, 1); saveSettings(); drawChips(); });
        chips.appendChild(c);
      });

        b.classList.toggle("on", S[k]);

    $$(".seg", w).forEach(sg => $$("button", sg).forEach(b => b.addEventListener("click", () => {
      const v = b.dataset.v;

      if (sg.dataset.k === "mode") { applyTheme(); FX.setShape(); }
      $$("button", sg).forEach(x => x.classList.toggle("on", x === b));

      saveSettings();
    })));
    $("#pPinSet", w).addEventListener("click", () => {
      const a = $("#pPin1", w).value.trim(), b = $("#pPin2", w).value.trim(), m = $("#pPinMsg", w);
      if (!/^\d{4}$/.test(a)) { m.textContent = "4けたの すうじを いれてください"; return; }
      if (a !== b) { m.textContent = "2かいの すうじが ちがいます。もういちど いれてください"; return; }
      S.pin = a; saveSettings();
      $("#pPin1", w).value = ""; $("#pPin2", w).value = "";
      m.textContent = "かえました";
    });
    $("#pBack", w).addEventListener("click", () => { document.activeElement && document.activeElement.blur && document.activeElement.blur(); keepAwake(); go("home"); });
    $("#pEnd", w).addEventListener("click", () => { document.activeElement && document.activeElement.blur && document.activeElement.blur(); go("end"); });
  },
};

/* =========================================================
   親ロック（右上の すみ を 3びょう ながおし → PIN）
   ========================================================= */
const Lock = {
  hold: null, tries: 0, entry: "",
  init(){
    const spot = $("#lock"), gb = $(".gb", spot), circ = $("#lockRing circle");
    const cancel = (wiggle) => {
      if (!this.hold) return;
      clearTimeout(this.hold.t2);
      if (this.hold.a) this.hold.a.cancel();
      circ.style.strokeDashoffset = 144.51; this.hold = null;
      if (wiggle === true) gb.animate([{ transform: "rotate(0)" }, { transform: "rotate(-25deg)" }, { transform: "rotate(25deg)" }, { transform: "rotate(0)" }], { duration: 300 });
    };
    spot.addEventListener("pointerdown", e => {
      e._handled = true;
      if (this.hold) return;
      try { spot.setPointerCapture(e.pointerId); } catch (_) {}
      const hd = { id: e.pointerId, x: e.clientX, y: e.clientY };
      hd.a = circ.animate([{ strokeDashoffset: 144.51 }, { strokeDashoffset: 0 }], { duration: 3000, fill: "forwards" });
      hd.t2 = setTimeout(() => { cancel(); Sound.play("chime"); this.open(); }, 3000);
      this.hold = hd;
    });
    spot.addEventListener("pointermove", e => {
      if (this.hold && e.pointerId === this.hold.id && Math.hypot(e.clientX - this.hold.x, e.clientY - this.hold.y) > 10) cancel();
    });
    spot.addEventListener("pointerup", () => cancel(true));
    spot.addEventListener("pointercancel", () => cancel(false));

    const pad = $("#pin .pinpad");
    ["1", "2", "3", "4", "5", "6", "7", "8", "9", "とじる", "0", "けす"].forEach(k => {
      const b = h(`<button class="${k.length > 1 ? "sm" : ""}">${k}</button>`);
      b.addEventListener("pointerdown", e => { e._handled = true; e.preventDefault(); this.key(k); });
      pad.appendChild(b);
    });
  },
  open(){
    if (!S.usePin) { if (current !== "parent") { navBusy = false; go("parent"); } return; }
    this.tries = 0; this.entry = "";
    $("#pin .pin-msg").textContent = "";
    this.draw();
    $("#pin").hidden = false;
  },
  close(){ $("#pin").hidden = true; this.entry = ""; },
  draw(){ $$("#pin .pin-dots i").forEach((d, i) => d.classList.toggle("f", i < this.entry.length)); },
  key(k){
    Sound.play("tap");
    if (k === "とじる") { this.close(); return; }
    if (k === "けす") { this.entry = this.entry.slice(0, -1); this.draw(); return; }
    if (this.entry.length >= 4) return;
    this.entry += k; this.draw();
    if (this.entry.length === 4) {
      const pin = /^\d{4}$/.test(S.pin) ? S.pin : "0000";
      if (this.entry === pin) {
        setTimeout(() => { this.close(); go("parent"); }, 150);
      } else {
        this.tries++;
        const dots = $("#pin .pin-dots");
        dots.animate([{ transform: "translateX(0)" }, { transform: "translateX(-8px)" }, { transform: "translateX(8px)" }, { transform: "translateX(0)" }], { duration: 300 });
        setTimeout(() => {
          this.entry = ""; this.draw();
          if (this.tries >= 3) this.close();
          else $("#pin .pin-msg").textContent = "もういちど どうぞ";
        }, 320);
      }
    }
  },
};

/* =========================================================
   🏠 もどる：2びょう おしつづけると「おしごと えらび」へ
   （子どもの トントン では もどらない）
   ========================================================= */
const HomeBtn = {
  hold: null,
  init(){
    const el = $("#homeBtn"), hb = $(".hb", el), circ = $(".hr circle", el);
    this.el = el;
    const cancel = (wiggle) => {
      const hd = this.hold; if (!hd) return;
      clearTimeout(hd.t); if (hd.a) hd.a.cancel();
      circ.style.strokeDashoffset = 157.08;
      this.hold = null;
      if (wiggle) hb.animate([{ transform: "rotate(0)" }, { transform: "rotate(-10deg)" }, { transform: "rotate(10deg)" }, { transform: "rotate(0)" }], { duration: 300 });
    };
    el.addEventListener("pointerdown", e => {
      e._handled = true;
      if (this.hold || !e.isPrimary) return;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      Sound.play("pick");
      const hd = { id: e.pointerId, x: e.clientX, y: e.clientY };
      hd.a = circ.animate([{ strokeDashoffset: 157.08 }, { strokeDashoffset: 0 }], { duration: 2000, fill: "forwards" });
      hd.t = setTimeout(() => { cancel(false); Sound.play("chime"); go("home"); }, 2000);
      this.hold = hd;
    });
    el.addEventListener("pointermove", e => {
      if (this.hold && e.pointerId === this.hold.id && Math.hypot(e.clientX - this.hold.x, e.clientY - this.hold.y) > 20) cancel(true);
    });
    el.addEventListener("pointerup", () => cancel(true));
    el.addEventListener("pointercancel", () => cancel(false));
    this.cancel = cancel;
  },
  show(on){ if (!on && this.cancel) this.cancel(false); this.el.classList.toggle("show", !!on); },
};

/* =========================================================
   全体のしかけ
   ========================================================= */
// ピンチズーム・ダブルタップズーム・長押しメニューを止める
["gesturestart", "gesturechange", "gestureend"].forEach(n => document.addEventListener(n, ev => ev.preventDefault(), { passive: false }));
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
document.addEventListener("selectstart", e => { if (!(e.target.closest && e.target.closest("input,textarea"))) e.preventDefault(); });
document.addEventListener("touchmove", e => {
  if (e.touches && e.touches.length > 1) { e.preventDefault(); return; }
  if (!(e.target.closest && e.target.closest(".scroll"))) e.preventDefault();
}, { passive: false });
document.addEventListener("touchend", () => Sound.unlock(), true);

// どこを触っても、すぐに反応する
document.addEventListener("pointerdown", () => { Sound.unlock(); finishAllTyping(); }, true);
document.addEventListener("pointerdown", e => {
  FX.ripple(e.clientX, e.clientY);
  if (!e._handled && e.isPrimary && current !== "parent") Sound.play("tap");
});

// 画面スリープ抑止（できる端末だけ）
let wake = null;
function keepAwake(){
  if (current === "end") return;
  try {
    if ("wakeLock" in navigator && !wake && document.visibilityState === "visible") {
      navigator.wakeLock.request("screen").then(w => { wake = w; w.addEventListener("release", () => { wake = null; }); }).catch(() => {});
    }
  } catch (e) {}
}
function releaseAwake(){ try { if (wake) wake.release(); } catch (e) {} wake = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") BGM.stop();
  if (document.visibilityState === "visible") {
    BGM.play(current);
    try { if (Sound.ctx && Sound.ctx.state !== "running") Sound.ctx.resume().catch(() => {}); } catch (e) {}
    keepAwake();
  }
});

function applyNight(){ document.documentElement.classList.toggle("night", !!S.night); }
function applyTheme(){ document.documentElement.classList.toggle("girl", S.mode === "girl"); }
function layout(){
  const r = $("#app").getBoundingClientRect();
  const sw = Math.max(200, Math.min(r.width, r.height * 0.62));
  U = sw / 100;
  document.documentElement.style.setProperty("--sw", sw + "px");
  document.documentElement.style.setProperty("--u", U + "px");
}
let resizeT = 0;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 120); layout(); });
window.addEventListener("orientationchange", () => setTimeout(layout, 300));

layout();
applyNight();
applyTheme();
FX.init();
Lock.init();
HomeBtn.init();
go("boot");
</script>
